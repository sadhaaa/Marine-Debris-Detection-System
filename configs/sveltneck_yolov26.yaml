
# SvelteNeck-YOLO26 (e=0.50) — Model Architecture Configuration
# Custom neck with SvelteNeck attention, no F3M.

nc: 22
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

scale: n

backbone:
  - [-1, 1, Conv,   [64,  3, 2]]          # 0 - P1/2
  - [-1, 1, Conv,   [128, 3, 2]]          # 1 - P2/4
  - [-1, 2, C3k2,   [256, False, 0.25]]   # 2
  - [-1, 1, Conv,   [256, 3, 2]]          # 3 - P3/8
  - [-1, 2, C3k2,   [512, False, 0.25]]   # 4  ← P3 features (128ch after scale)
  - [-1, 1, Conv,   [512, 3, 2]]          # 5 - P4/16
  - [-1, 2, C3k2,   [512, True]]          # 6  ← P4 features (128ch after scale)
  - [-1, 1, Conv,   [1024, 3, 2]]         # 7 - P5/32
  - [-1, 2, C3k2,   [1024, True]]         # 8
  - [-1, 1, SPPF,   [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA,  [1024]]               # 10 ← P5 features (256ch after scale)

head:
  # SvelteNeck fuses P3(4), P4(6), P5(10) → returns [P3_out, P4_out, P5_out]
  - [[4, 6, 10], 1, SvelteNeck, [0.50]]   # 11

  # Unpack outputs
  - [11, 1, Index, [64,  0]]              # 12 — P3 64ch
  - [11, 1, Index, [128, 1]]              # 13 — P4 128ch
  - [11, 1, Index, [256, 2]]              # 14 — P5 256ch

  # Detect
  - [[12, 13, 14], 1, Detect, [nc]]       # 15