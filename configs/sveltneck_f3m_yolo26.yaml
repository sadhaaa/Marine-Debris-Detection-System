
# SvelteNeck + F3M — Full Custom Model Configuration
# SvelteNeck neck (e=0.50) + F3M attention gates — the primary research model.

nc: 22
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

scale: n

backbone:
  - [-1, 1, Conv,   [64,  3, 2]]
  - [-1, 1, Conv,   [128, 3, 2]]
  - [-1, 2, C3k2,   [256, False, 0.25]]
  - [-1, 1, Conv,   [256, 3, 2]]
  - [-1, 2, C3k2,   [512, False, 0.25]]
  - [-1, 1, Conv,   [512, 3, 2]]
  - [-1, 2, C3k2,   [512, True]]
  - [-1, 1, Conv,   [1024, 3, 2]]
  - [-1, 2, C3k2,   [1024, True]]
  - [-1, 1, SPPF,   [1024, 5, 3, True]]
  - [-1, 2, C2PSA,  [1024]]               # 10

head:
  # SvelteNeck fuses P3(4), P4(6), P5(10)
  - [[4, 6, 10], 1, SvelteNeck, [0.50]]   # 11  → [P3_64, P4_128, P5_256]

  # Unpack outputs
  - [11, 1, Index, [64,  0]]              # 12 — P3 raw
  - [11, 1, Index, [128, 1]]              # 13 — P4 raw
  - [11, 1, Index, [256, 2]]              # 14 — P5 raw

  # F3M attention on each scale
  - [12, 1, F3M, [64]]                    # 15 — P3 attended
  - [13, 1, F3M, [128]]                   # 16 — P4 attended
  - [14, 1, F3M, [256]]                   # 17 — P5 attended

  # Detect head
  - [[15, 16, 17], 1, Detect, [nc]]       # 18
