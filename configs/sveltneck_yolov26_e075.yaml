
# SvelteNeck-YOLO26 (e=0.75) — Model Architecture Configuration
# Wider expansion ratio for richer feature representation.
# Approx 6.45 GFLOPs (slightly above 5.8 target — trained for comparison).

nc: 22
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

scale: n

backbone:
  - [-1, 1, Conv,   [64,  3, 2]]
  - [-1, 1, Conv,   [128, 3, 2]]
  - [-1, 2, C3k2,   [256, False, 0.25]]
  - [-1, 1, Conv,   [256, 3, 2]]
  - [-1, 2, C3k2,   [512, False, 0.25]]
  - [-1, 1, Conv,   [512, 3, 2]]
  - [-1, 2, C3k2,   [512, True]]
  - [-1, 1, Conv,   [1024, 3, 2]]
  - [-1, 2, C3k2,   [1024, True]]
  - [-1, 1, SPPF,   [1024, 5, 3, True]]
  - [-1, 2, C2PSA,  [1024]]

head:
  - [[4, 6, 10], 1, SvelteNeck, [0.75]]   # e=0.75

  - [11, 1, Index, [64,  0]]
  - [11, 1, Index, [128, 1]]
  - [11, 1, Index, [256, 2]]

  - [[12, 13, 14], 1, Detect, [nc]]
